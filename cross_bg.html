eight":720,"ext":"mp4","size":124669665,"bitrate":1333,"public":true,"status":2,"progress":1.0,"metadata":{"max_bitrate":289708,"average_bitrate":177703,"early_max_bitrate":519632},"url":"https://embed-ssl.wistia.com/deliveries/bd0d5b6f553713ad00e6e513851f7885fe54aeae.bin","created_at":1529952081,"segment_duration":3,"opt_vbitrate":3750},{"type":"hd_mp4_video","slug":"mp4_h264_3444k","display_name":"1080p","details":{},"container":"mp4","codec":"h264","width":1920,"height":1080,"ext":"mp4","size":322052296,"bitrate":3444,"public":true,"status":2,"progress":1.0,"metadata":{"max_bitrate":610373,"average_bitrate":420534,"early_max_bitrate":834156},"url":"https://embed-ssl.wistia.com/deliveries/69717cede197f2396612b07e5dfad7a3a87c6bb5.bin","created_at":1529952081,"segment_duration":3,"opt_vbitrate":5625},{"type":"storyboard","slug":"storyboard_2000x2260","display_name":"Storyboard","details":{},"width":2000,"height":2260,"ext":"jpg","size":893758,"bitrate":0,"public":true,"status":2,"progress":1.0,"metadata":{"frame_width":200,"frame_height":113,"frame_count":200,"aspect_ratio":1.7777777777777777},"url":"https://embed-ssl.wistia.com/deliveries/1eb3b4caa57576472d1e608ee7d06d0ae4483bc1.bin","created_at":1529952081},{"type":"still_image","slug":"still_image_1920x1080","display_name":"Thumbnail Image","details":{},"width":1920,"height":1080,"ext":"jpg","size":90919,"bitrate":0,"public":true,"status":2,"progress":1.0,"url":"https://embed-ssl.wistia.com/deliveries/b7721b6da651910541da6b5b4b695bcca67e1d5a.bin","created_at":1530107344}],"branding":false,"createdAt":1524590896,"distilleryUrl":"https://distillery.wistia.com/x","duration":730.459,"enableCustomerLogo":true,"firstEmbedForAccount":false,"firstShareForAccount":false,"availableTranscripts":[{"language":"eng","ietf_language_tag":"eng","alpha3_terminologic":"","alpha3_bibliographic":"eng","iso639_2_language_code":"en","english_name":"English","native_name":"English","right_to_left":false}],"hashedId":"r9obz7ft6e","mediaId":33524893,"mediaKey":"wistia-production_33524893","mediaType":"Video","name":"20. Faith (Lesson)","preloadPreference":null,"progress":1.0,"protected":false,"projectId":9051064,"seoDescription":"a \nCREDO: An RCIA Program Folder video","showAbout":true,"status":2,"type":"Video","playableWithoutInstantHls":true,"stats":{"loadCount":2980,"playCount":2478,"uniqueLoadCount":1772,"uniquePlayCount":1650,"averageEngagement":0.618072},"trackingTransmitInterval":24,"liveStreamEventDetails":null,"integrations":{"facebook_ads":true,"google_analytics4":true},"captions":[{"language":"eng","text":"(inspiring orchestral music) The grace of God is incredibly powerful and has many different effects in our lives. God gives us sanctifying grace in the depths of our souls, but this grace overflows into our minds and hearts and results in the virtues of faith, hope, and charity. Faith, hope, and charity are called theological virtues because they direct us to God so that we might know and love him. They establish us in personal contact with the Holy Trinity and shape us more and more according to God's image.\n\nThis is why we'll be talking a lot about the theological virtues over the next few sessions. They're at the heart of the Christian life. They're at the heart of Christian morality. We already talked a little bit about the virtue of faith earlier when we were speaking of Divine Revelation.\n\nBut it's helpful to consider the role faith plays in the life of an individual Christian. Faith is a very common word in our language, but when people typically use it, they're saying, \"Oh, I have faith in you\" or \"I'll take it on faith.\" Those instances are typically referring to a relationship of trust or hope that one person has in another. But for us as Christians, faith also has a transcendent meaning.\n\nSupernatural faith that is the theological virtue of faith is about God. The virtue of faith is like a supernatural light. By faith, we freely accept an ascent to the whole truth that God has revealed. It leads to a spiritual confidence backed by divine truthfulness, its divine power that brings about and strengthens our faith.\n\nThe theological virtue of faith is supernatural and divine since it involves God elevating our minds and moving our wills to freely ascent to what he's revealed. Through faith, we come into contact with him and begin to know divine mysteries we could never discover on our own. God, as our almighty creator, is able to work quietly yet powerfully within the depths of our souls to bring about and strengthen our faith. Faith calls for a certain surrender of the mind to God, which we call the obedience of faith.\n\nFaith gives us certitude about God, but it also gives us certitude about the world and as it stands in relation to him. Faith is the assurance of things hoped for and the conviction of things not seen. Saint Thomas Aquinas teach that professing the faith is not merely a matter of words. Rather, by professing the propositions or articles of the creed, our minds actually make contact with God, with God himself.\n\nOur minds are knit to him. We don't just believe that God exists. We don't just believe the things that God tells us. By faith, we believe God himself who is the truth.\n\nSince faith puts us in contact with God, the things we believe by faith are critically important. Catholics must profess the faith in its entirety, without neglecting or rejecting anything. We manifest and renew our beliefs each Sunday at every Sunday mass through the profession of faith, also called the creed. If we understand faith as a relationship, it's easy to see the danger of being a selective believer.\n\nA selective believer is one who chooses certain teachings to believe and rejects others. Sometimes this is called Cafeteria Catholicism. But being Catholic is not an ala carte experience where we choose certain beliefs we like and we leave behind others that we don't. By its nature, faith involves a whole acceptance of God and what he's revealed, because it establishes us in a relationship of trust and obedience to him, to God who is truth itself and who cannot deceive us.\n\nThe selective believer puts his belief in jeopardy because he undermines the very foundation of his belief, that loving and trusting relationship with almighty God. The true believer accepts what the church proposes as definitively revealed by God. The church is God's chosen witness and her authority is ultimately founded on the witness of the apostles. A person can sin against faith through doubt, that is to reject what God has revealed.\n\nAnd this can be a partial rejection of the faith or a complete rejection of the faith, which we call apostacy. Also, to take part in superstitious or cult practices such as visiting a palm reader or using tarot cards or something like that is to sin against faith. Many people freely engage in these practices lightheartedly. But it's not a joking matter.\n\nSuch practices seriously undermine one's relationship with God and expose one to the influence of evil spirits. Worries about the faith, even sometimes serious worries about matters of faith, that's not necessarily sinful. For example, if someone finds discrepancies in the Bible and that calls into question the authority of the Bible for them, it's good for them to seek out an answer to this question. This is not the sin of infidelity as long as one has not withdrawn ascent to the faith, as long as one has not undermine that fundamental relationship of trust with God.\n\nSince the object of faith remains somewhat obscure, it's normal that our intellects will continue to churn and continue to pose questions, even though sometimes, those questions will be hard to answer. To ask questions about the faith or to seek a better explanation of what one believes is not the same as doubting. It's good to probe deeper into divine mysteries. Faith seeks understanding.\n\nIt's important, however, not to delay our belief in search of a perfect understanding. It will be wrong for me to think I believe in this teaching only when it makes perfect sense to me. Our human reason is limited and so must surrender to God in the obedience of faith in order to know divine truths. If we withheld our belief until we completely comprehended all the divine mysteries, we would be waiting forever.\n\nA full and mature understanding of many matters of faith is only possible from a disposition, from a perspective of belief. We believe so that we may understand. Catholics must also be content to know that answers to some questions will remain obscure and mysterious in this life. God has given us everything we need for our salvation.\n\nBut not necessarily everything we need to satisfy our present curiosity. While faith is a work of God in us, it's also something that we should nurture and nourish. Catholics have a responsibility to continue to learn more about their faith by reading the scriptures, the catechism and various spiritual books. Catholics should also take advantage of adult education programs, bible studies, other groups like that that are designed to enrich our faith.\n\nOur understanding of the faith must grow as we grow, because an adult life, an adult life of faith needs an adult understanding. Catholics who've received the sacraments of initiation and who practiced the faith whole-heartedly are confirmed and strengthened by God through the supernatural sense of the faith or sensus fidei. We see this at work when there's a universal consent among the members of the church on matters of faith and morals. And this sense also allows believers to reject instinctively whatever contradicts the faith.\n\nWe should know too that the Holy Spirit helps us believers to penetrate into divine mysteries through the gift of understanding, and also helps us to see the surpassing value of spiritual things through the gift of wisdom. It's common for someone recently introduced to the Catholic faith to find certain teachings difficult to understand or contrary to their former outlook. When certain teachings seem hard to understand or difficult to accept, it's important to approach them with the right disposition. Trusting in God who is always truthful, one could pray, \"I believe Lord.\n\n\"Help my unbelief.\" Or whenever someone has a particular difficulty with some particular teaching of the faith, it's best to seek out a further explanation from an official guide, whether it be a written guide like the catechism or someone we ask in person, like a priest or trusted Catholic teacher of the faith. The Catholic faith is an interconnected hole that combines belief and practice, and many converts find that faith takes on a complete, comprehensive clarity for them only after being fully initiated and beginning to practice the faith. Many people set faith and reason in opposition as if belief were to make one irrational.\n\nHowever, we know that faith never contradicts reason. By faith, our minds are supernaturally elevated to know divine mysteries. So in this sense, faith is above reason but it's never against it. In fact, faith and reason are fundamentally in harmony.\n\nIndeed, one needs to think in order to believe. One needs to grasp some measure what it is being proposed for belief. For example, that Christ is true God and true man. In order to make an act of faith in what's proposed, if there seems to be a contradiction between a finding of academic research and the truth of the Catholic faith, they are not two truths.\n\nEither the finding of the research is false or the truth of the faith is not properly understood. So having this perspective and this understanding of faith and reason allows Catholics to freely engage in academic and scientific pursuits without fear of discovering something that will contradict their faith or call it into question. Now that we've spoken about the theological virtue of faith, we can move on to another important virtue: hope. Until then, may God bless you."}],"hls_enabled":true,"embed_options":{"playerColor":"54bbff","playerColorGradient":{"on":false,"colors":[["870000",0],["ed6666",1]]},"plugin":{"facebookPixel":{"on":true,"legacy":false,"pixelId":"1444196575871252"},"googleAnalytics4":{"on":true,"measurementId":"G-65V1L7CFCL","usePageGA4Config":false},"captions-v1":{"onByDefault":"false"},"share":{"channels":"facebook-twitter-embed","pageTitle":"Session 20 - Fr. Raymund Snyder - Review","pageUrl":"http://tanbooks.wistia.com/medias/r9obz7ft6e","downloadType":"sd_mp4","tweetText":"{video_name}","overrideUrl":"false","conversionOpportunityKey":"wistia-production_2867461"}},"volumeControl":"true","fullscreenButton":"true","controlsVisibleOnLoad":"true","bpbTime":"false","vulcan":true,"stillUrl":"https://embed-ssl.wistia.com/deliveries/b7721b6da651910541da6b5b4b695bcca67e1d5a.bin","branding":"false","showCustomerLogo":"true","autoPlay":"false","endVideoBehavior":"default","playbar":"true","playButton":"true","settingsControl":"true","qualityControl":"true","playbackRateControl":"true","smallPlayButton":"true","spherical":"false","newRoundedIcons":true,"shouldShowCaptionsSettings":false},"embedOptions":{"playerColor":"54bbff","playerColorGradient":{"on":false,"colors":[["870000",0],["ed6666",1]]},"plugin":{"facebookPixel":{"on":true,"legacy":false,"pixelId":"1444196575871252"},"googleAnalytics4":{"on":true,"measurementId":"G-65V1L7CFCL","usePageGA4Config":false},"captions-v1":{"onByDefault":"false"},"share":{"channels":"facebook-twitter-embed","pageTitle":"Session 20 - Fr. Raymund Snyder - Review","pageUrl":"http://tanbooks.wistia.com/medias/r9obz7ft6e","downloadType":"sd_mp4","tweetText":"{video_name}","overrideUrl":"false","conversionOpportunityKey":"wistia-production_2867461"}},"volumeControl":"true","fullscreenButton":"true","controlsVisibleOnLoad":"true","bpbTime":"false","vulcan":true,"stillUrl":"https://embed-ssl.wistia.com/deliveries/b7721b6da651910541da6b5b4b695bcca67e1d5a.bin","branding":"false","sho
